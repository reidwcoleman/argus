name: Data snapshot
# The hosted site has no server, so every 20 minutes this job runs the Argus server's own feed code
# and publishes the answers to the `data` branch (one commit, replaced each time).
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take snapshot
        run: node scripts/snapshot.mjs out
      - name: Publish
        working-directory: out
        run: |
          git checkout -q --orphan fresh
          git add -A
          git -c user.name="argus-snapshot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin fresh:data
