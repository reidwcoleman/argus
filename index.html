<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c0a" />
    <title>Argus</title>
    <meta name="description" content="Every public signal on one live 3D globe: aircraft, ships, satellites, quakes, fires, weather and public cameras." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script>window.CESIUM_BASE_URL = '/cesium/';</script>
    <script src="/cesium/Cesium.js"></script>
  </head>
  <body>
    <div id="globe" aria-label="Interactive globe"></div>
    <canvas id="wind" aria-hidden="true"></canvas>
    <canvas id="detect" aria-hidden="true"></canvas>
    <div id="hud" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="cockpit" hidden></div>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-mark">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="1.5" />
          <path class="boot-arc" d="M32 3 a29 29 0 0 1 29 29" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" />
          <path d="M8 32c6-10 14-15 24-15s18 5 24 15c-6 10-14 15-24 15S14 42 8 32Z" fill="none" stroke="currentColor" stroke-width="1.5" />
          <circle cx="32" cy="32" r="7" fill="var(--accent)" />
        </svg>
      </div>
      <div class="boot-name">ARGUS</div>
      <div class="boot-line" id="boot-line">Waking the globe</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
